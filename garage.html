<!DOCTYPE html>
<html lang="it" class="garage-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Leti's Car Color Picker - Garage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="garage">
  <div class="gradient-bg"></div>

  <main class="garage-main container position-relative py-5">
    <header class="text-center text-white mb-4 mb-md-5">
      <h1 class="garage-title fw-light mb-2" data-i18n="chooseCar">Scegli l'auto</h1>
      <p class="garage-sub mb-0" data-i18n="chooseCarSub">Tocca un'auto per configurarla</p>
    </header>

    <div id="carGrid" class="car-grid"></div>
  </main>

  <div class="position-fixed top-0 end-0 m-3">
    <button id="backBtn" class="icon-btn btn glass rounded-circle shadow-sm" data-i18n-title="back" title="Indietro">&larr;</button>
  </div>

  <div id="langSwitch" class="lang-switch glass position-fixed bottom-0 end-0 m-3 d-flex gap-2 p-2 rounded-pill shadow">
    <button class="flag-btn" data-lang="it" aria-label="Italiano">
      <svg viewBox="0 0 60 30" class="flag-svg">
        <rect width="20" height="30" fill="#009246"/>
        <rect x="20" width="20" height="30" fill="#fff"/>
        <rect x="40" width="20" height="30" fill="#CE2B37"/>
      </svg>
    </button>
    <button class="flag-btn" data-lang="en" aria-label="English">
      <svg viewBox="0 0 60 30" class="flag-svg">
        <clipPath id="ukclipg"><rect width="60" height="30"/></clipPath>
        <g clip-path="url(#ukclipg)">
          <rect width="60" height="30" fill="#012169"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2.5"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="5"/>
        </g>
      </svg>
    </button>
  </div>

  <script type="module" src="garage.js"></script>
</body>
</html>
